name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests en UTC
        run: pnpm test
        env:
          TZ: UTC
      - name: Tests en America/Santiago
        run: pnpm test
        env:
          TZ: America/Santiago
      - run: pnpm check:functions
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm audit --prod

  supabase:
    name: Base y Edge Functions en Supabase local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generar una llave del generador de códigos solo para este run
        run: echo "SERVER_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Levantar Supabase y aplicar migraciones
        run: pnpm exec supabase start
      - name: Lint del esquema
        run: pnpm exec supabase db lint --fail-on warning
      - name: Tests de la base contra Supabase real
        run: pnpm test tests/db
        env:
          TEST_DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres
      - name: Esperar a que las Edge Functions respondan
        run: |
          for intento in $(seq 1 60); do
            estado=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/create-family -d '{}' || true)
            if [ "$estado" = "401" ]; then exit 0; fi
            sleep 2
          done
          echo "Las Edge Functions no respondieron 401 a un anónimo; último estado: $estado"
          docker ps --format '{{.Names}}' | grep -i edge | xargs -r -n1 docker logs --tail 80
          exit 1
      - name: Tests de integración
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/supabase.env"
          echo "Variables disponibles: $(cut -d= -f1 "$RUNNER_TEMP/supabase.env" | tr '\n' ' ')"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          pnpm test:integration
      - name: Construir la aplicación conectada al Supabase local
        run: |
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" pnpm build
          pnpm check:bundle
      - name: Instalar el navegador de pruebas
        run: pnpm exec playwright install --with-deps chromium
      - name: Prueba de punta a punta en tamaño de teléfono
        run: |
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          pnpm test:e2e
      - name: Guardar capturas de pantalla y trazas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: punta-a-punta
          path: e2e-resultados
          if-no-files-found: ignore
